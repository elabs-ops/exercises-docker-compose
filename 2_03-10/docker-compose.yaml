services:
  backend:
    image: elabsops/docker-backend-example:latest
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    restart: unless-stopped
    container_name: backend-example
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: elabsops/docker-frontend-example:latest
    ports:
      - "${FRONTEND_PORT:-5001}:5001"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080
    container_name: frontend-example

  redis:
    image: redis:alpine
    container_name: redis-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
